				<svg class="zigzag-svg" id="zigzag-svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMin meet">
					<defs>
						<filter id="glow">
							<feGaussianBlur stdDeviation="6" result="coloredBlur"></feGaussianBlur>
							<feMerge>
								<feMergeNode in="coloredBlur"></feMergeNode>
								<feMergeNode in="SourceGraphic"></feMergeNode>
							</feMerge>
						</filter>
					</defs>
					<path id="zigzag-path" class="animated-path" stroke="#a2b1ff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.9"></path>
					<g id="zigzag-points"></g>
				</svg>
				<div id="project-line-desktop"></div>
			</div>
			<div class="timeline-mobile">
				<div class="vertical-line"></div>
				<div id="project-line-mobile"></div>
